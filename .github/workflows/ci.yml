name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2 # liest rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Protocol types are up to date (otherwise run `just protocol` and commit)
        run: |
          rm -rf crates/protocol/bindings
          cargo test -p harrier-protocol export_bindings --quiet
          git diff --exit-code crates/protocol/bindings
