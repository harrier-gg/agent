[package]
name = "harrier"
description = "Harrier agent and CLI"
version.workspace = true
edition.workspace = true

[dependencies]
harrier-protocol = { path = "../protocol" }
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bollard = "0.21.1"
regex = "1.13.1"
cap-std = "3"
